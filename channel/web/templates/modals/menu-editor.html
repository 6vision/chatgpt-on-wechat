    <!-- Menu Editor Modal -->
    <div id="menu-editor-overlay" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center">
        <div class="menu-editor" role="dialog" aria-modal="true" aria-labelledby="menu-editor-title">
            <div class="menu-editor-head">
                <div class="min-w-0">
                    <h3 id="menu-editor-title" class="menu-editor-title" data-i18n="menu_edit">自定义菜单</h3>
                    <p class="menu-editor-desc" data-i18n="menu_edit_desc">拖动调整顺序和分组，也可以把产物或网页放进菜单。Web 端和桌面端共用这份菜单。</p>
                </div>
                <button class="workspace-icon-btn" onclick="menuEditorClose()" data-i18n-aria-label="channels_cancel">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div id="menu-editor-body" class="menu-editor-body"></div>
            <div class="menu-editor-foot">
                <button class="me-foot-btn" onclick="menuEditorAddGroup()">
                    <i class="fas fa-folder-plus"></i><span data-i18n="menu_add_group">添加分组</span>
                </button>
                <button class="me-foot-btn" onclick="menuEditorReset()">
                    <i class="fas fa-rotate-left"></i><span data-i18n="menu_reset">恢复默认</span>
                </button>
                <span id="menu-editor-error" class="menu-editor-error"></span>
                <button class="px-4 py-2 rounded-lg border border-slate-200 dark:border-white/10
                               text-slate-600 dark:text-slate-300 text-sm font-medium
                               hover:bg-slate-50 dark:hover:bg-white/5
                               cursor-pointer transition-colors duration-150"
                        onclick="menuEditorClose()" data-i18n="cancel">取消</button>
                <button id="menu-editor-save"
                        class="px-4 py-2 rounded-lg bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium
                               cursor-pointer transition-colors duration-150"
                        onclick="menuEditorSave()" data-i18n="save">保存</button>
            </div>
            <div id="menu-editor-pop" class="me-pop hidden"></div>
        </div>
    </div>
